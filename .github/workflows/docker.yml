# GitHub Actions: build and publish the archived Node image.
#
# The Go image is published by the Gitea workflow (.gitea/workflows/docker.yml)
# as part of the GitHub → Gitea mirror. This workflow keeps the Node image
# buildable and available, because it is the rollback target until the Go server
# has been trusted in production.
#
# It publishes under explicit `:node-*` tags so it can never collide with the
# Go image, which owns `latest`.
name: Build and publish Node image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/my-cloud
          tags: |
            type=raw,value=node-latest
            type=raw,value=archived,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # OLD/ is the archived Node app. It is its own build context so the
          # Go tree does not bloat the image and the two builds stay separate.
          context: OLD
          file: OLD/Dockerfile.node
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  go-checks:
    # The Go source is the thing being developed now, so the Go suite runs on
    # GitHub too even though the image is published from Gitea.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Check every source file is tracked
        # A source file excluded by .gitignore builds fine locally and fails
        # only in CI, because a fresh checkout does not have it. This caught
        # internal/config/ being swallowed by an unanchored "config/" pattern.
        run: ./scripts/check-tracked.sh

      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...