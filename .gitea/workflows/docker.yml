# Gitea Actions: build the Go image and publish it to GHCR.
#
# Gitea mirrors the GitHub repository; this workflow runs there and pushes the
# image to the same GitHub Container Registry the Node image was published to,
# so consumers do not need to care which forge triggered the build.
#
# Tags produced for a build of VERSION X.Y.Z at commit C:
#   X.Y.Z          the exact release
#   X.Y            the minor line, moving forward
#   X              the major line, moving forward
#   latest         only when X.Y.Z is the highest version seen (i.e. a release)
#   C              the commit sha, so every commit is addressable
#
# Every commit therefore gets its own immutable tag, and the minor/major tags
# point at the newest release in that line.
name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The GHCR package path. This must be the *GitHub* owner and repo, because
  # that is where the package lives: ${{ github.repository }} inside Gitea
  # would resolve to the Gitea mirror's path, which is not necessarily the
  # same. Change this if the GitHub repository is ever renamed or forked.
  IMAGE_NAME: delharris1981/my-cloud

jobs:
  detect:
    # Decides whether the test suite has to run at all.
    #
    # Rebuilding for a docs or CI change does not need vet, the race detector,
    # and the filesystem audit; skipping them saves several minutes per push.
    #
    # The gate is deliberately narrow and fails safe: anything that could
    # affect the binary counts as core, and an unreadable diff, a missing
    # parent commit, or a manual run all fall through to running the tests.
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.decide.outputs.core_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the core changed
        id: decide
        run: |
          set -eu

          # Paths that can change what the binary does. Everything else is
          # packaging, documentation, or CI configuration.
          #
          # dev-config-gen.js is listed because the end-to-end migration test
          # executes it: if it changes, the test must run.
          CORE='^(cmd|internal|web)/|^go\.(mod|sum)$|^dev-config-gen\.js$'

          # A manual run is a deliberate "go and check this", so it always
          # tests regardless of what changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
            echo "manual run: testing unconditionally"
            exit 0
          fi

          BASE=$(git rev-parse --verify HEAD^ 2>/dev/null) || BASE=""
          if [ -z "$BASE" ]; then
            # First push, or a truncated clone. Failing safe means testing.
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
            echo "no parent commit available; testing unconditionally"
            exit 0
          fi

          if ! git diff --name-only "$BASE" HEAD > /tmp/changed.txt 2>/dev/null; then
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
            echo "could not diff against $BASE; testing unconditionally"
            exit 0
          fi

          echo "changed since $BASE:"
          sed 's/^/  /' /tmp/changed.txt

          if grep -qE "$CORE" /tmp/changed.txt; then
            core=true
            echo "core changed: running the full suite"
          else
            core=false
            echo "core unchanged: the test suite can be skipped"
          fi
          echo "core_changed=$core" >> "$GITHUB_OUTPUT"

          # Recorded either way. A silent skip is how CI rots: the next person
          # to look sees green and cannot tell whether the tests ran.
          {
            echo "### Test suite"
            if [ "$core" = "true" ]; then
              echo "Ran in full."
            else
              echo "**Skipped.** Nothing under \`cmd/\`, \`internal/\`, \`web/\`, or the module files changed."
              echo ""
              sed 's/^/- /' /tmp/changed.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  test:
    # Nothing is published until the code is proven: vet, tests under the race
    # detector, and the filesystem-access audit that enforces the vfs choke
    # point all have to pass first.
    needs: detect
    if: needs.detect.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check every source file is tracked
        # A source file excluded by .gitignore builds fine locally and fails
        # only in CI, because a fresh checkout does not have it. This caught
        # internal/config/ being swallowed by an unanchored "config/" pattern.
        run: ./scripts/check-tracked.sh

      - name: Verify CGO stays disabled
        # modernc.org/sqlite is pure Go precisely so the release binary is
        # static. A cgo dependency slipping in would silently break that.
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Audit filesystem access
        run: |
          hits=$(grep -rn --include='*.go' -E '\bos\.(Open|Create|OpenFile|WriteFile|ReadFile|RemoveAll|MkdirAll|Rename)\(' \
            ./cmd ./internal \
            | grep -v '_test\.go:' \
            | grep -v -E '^\./internal/(vfs|upload|store|config|crypt)/' \
            | grep -v -E 'internal/server/fsutil\.go' \
            | grep -v -E '^\./cmd/verify-cutover/' || true)
          if [ -n "$hits" ]; then
            echo "::error::user-data I/O must go through vfs.Resolve (internal/vfs)"
            echo "$hits"
            exit 1
          fi
          echo "no user-data filesystem access outside the allowed packages"

      - name: Audit for weak crypto
        run: |
          if grep -rn --include='*.go' -E '\bmd5\b|crypto/des\b' ./cmd ./internal; then
            echo "::error::weak or deprecated crypto primitive found"
            exit 1
          fi

  build:
    needs: [detect, test]
    # always() is required because a skipped dependency would otherwise skip
    # this job too. The condition then encodes the real rule: if the core
    # was untouched the tests never ran, so the build proceeds; if it
    # changed, the tests must have passed first.
    if: >-
      always() &&
      (needs.detect.outputs.core_changed == 'false' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitea's mirror of a GitHub repo has a shallow history by default;
          # the full clone is needed to compare tags and decide whether this
          # build is the newest release.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # The GHCR PAT is stored on the Gitea instance, not taken from the
          # mirrored repository's GitHub token — a mirror's GITHUB_TOKEN is
          # scoped to Gitea and cannot write to GHCR.
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Work out the tags
        id: meta
        run: |
          set -eu
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          SHA=$(git rev-parse --short HEAD)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          tags="$IMAGE:$VERSION $IMAGE:$MINOR $IMAGE:$MAJOR $IMAGE:sha-$SHA"

          # `latest` only moves when this version is the highest one ever
          # tagged. Otherwise a merge of an older branch would drag every
          # user back to an old image.
          newest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          newest=${newest#v}
          if [ -z "$newest" ]; then
            tags="$tags $IMAGE:latest"
            echo "no prior tags; latest will point here"
          elif [ "$VERSION" = "$newest" ]; then
            tags="$tags $IMAGE:latest"
            echo "$VERSION is the highest tag; latest will point here"
          else
            echo "newest released tag is $newest, not $VERSION; latest left alone"
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Tags for $IMAGE"
            echo '```'
            echo "$tags"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.go-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=My Cloud
            org.opencontainers.image.description=Self-hosted file sharing with plain files on disk
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ env.IMAGE_NAME }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          docker run -d --name mc -p 18686:8686 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18686/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          # The version inside the container must match the tag it was pulled
          # by, or the tag and the binary have drifted.
          inside=$(curl -fsS http://127.0.0.1:18686/api/version | grep -o '"version": *"[^"]*"' | head -1)
          echo "container reports $inside, expected $VERSION"
          echo "$inside" | grep -q "$VERSION" || { echo "::error::version drift"; docker logs mc; exit 1; }
          curl -fsS http://127.0.0.1:18686/api/status | grep -q '"needsSetup":true'
          docker logs mc
          docker rm -f mc

  webdav-conformance:
    # The plan names hand-rolled WebDAV edge cases as a risk and says to test
    # against real clients. rclone is what users actually mount with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install rclone
        run: |
          curl -sO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-v*-linux-amd64/rclone /usr/local/bin/
      - name: Start the server
        run: |
          mkdir -p cfg data
          ./scripts/build.sh
          ./my-cloud &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8686/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8686/healthz
      - name: Round-trip files over WebDAV
        env:
          MYCLOUD_CONFIG_DIR: cfg
          MYCLOUD_DATA_DIR: data
        run: ./scripts/dav-conformance.sh