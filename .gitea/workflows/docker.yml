# Gitea Actions: build the Go image and publish it to GHCR.
#
# Gitea mirrors the GitHub repository; this workflow runs there and pushes the
# image to the same GitHub Container Registry the Node image was published to,
# so consumers do not need to care which forge triggered the build.
#
# Tags produced for a build of VERSION X.Y.Z at commit C:
#   X.Y.Z          the exact release
#   X.Y            the minor line, moving forward
#   X              the major line, moving forward
#   latest         only when X.Y.Z is the highest version seen (i.e. a release)
#   C              the commit sha, so every commit is addressable
#
# Every commit therefore gets its own immutable tag, and the minor/major tags
# point at the newest release in that line.
name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The GHCR package path. This must be the *GitHub* owner and repo, because
  # that is where the package lives: ${{ github.repository }} inside Gitea
  # would resolve to the Gitea mirror's path, which is not necessarily the
  # same. Change this if the GitHub repository is ever renamed or forked.
  IMAGE_NAME: delharris1981/my-cloud

jobs:
  detect:
    # Decides whether the test suite has to run at all.
    #
    # Rebuilding for a docs or CI change does not need vet, the race detector,
    # and the filesystem audit; skipping them saves several minutes per push.
    #
    # The gate is deliberately narrow and fails safe: anything that could
    # affect the binary counts as core, and an unreadable diff, a missing
    # parent commit, or a manual run all fall through to running the tests.
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.decide.outputs.core_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the core changed
        id: decide
        run: |
          set -eu

          # Paths that can change what the binary does. Everything else is
          # packaging, documentation, or CI configuration.
          #
          # dev-config-gen.js is listed because the end-to-end migration test
          # executes it: if it changes, the test must run.
          CORE='^(cmd|internal|web)/|^go\.(mod|sum)$|^dev-config-gen\.js$'

          # A manual run is a deliberate "go and check this", so it always
          # tests regardless of what changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
            echo "manual run: testing unconditionally"
            exit 0
          fi

          BASE=$(git rev-parse --verify HEAD^ 2>/dev/null) || BASE=""
          if [ -z "$BASE" ]; then
            # First push, or a truncated clone. Failing safe means testing.
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
            echo "no parent commit available; testing unconditionally"
            exit 0
          fi

          if ! git diff --name-only "$BASE" HEAD > /tmp/changed.txt 2>/dev/null; then
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
            echo "could not diff against $BASE; testing unconditionally"
            exit 0
          fi

          echo "changed since $BASE:"
          sed 's/^/  /' /tmp/changed.txt

          if grep -qE "$CORE" /tmp/changed.txt; then
            core=true
            echo "core changed: running the full suite"
          else
            core=false
            echo "core unchanged: the test suite can be skipped"
          fi
          echo "core_changed=$core" >> "$GITHUB_OUTPUT"

          # Recorded either way. A silent skip is how CI rots: the next person
          # to look sees green and cannot tell whether the tests ran.
          {
            echo "### Verification"
            if [ "$core" = "true" ]; then
              echo "Test suite and WebDAV conformance both ran."
            else
              echo "**Both skipped.** Nothing under \`cmd/\`, \`internal/\`, \`web/\`, or the module files changed,
              so the server is identical to the last one that passed."
              echo ""
              sed 's/^/- /' /tmp/changed.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"


  test:
    # Nothing is published until the code is proven: vet, tests under the race
    # detector, and the filesystem-access audit that enforces the vfs choke
    # point all have to pass first.
    needs: detect
    if: needs.detect.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check the workflow files
        # Two failure shapes, because neither check catches the other.
        #
        # A step spliced into the middle of another step's `run:` block still
        # parses. One such edit shipped `fetch-depth: 0` into a shell script,
        # where the runner tried to execute it.
        #
        # A `with:` block landing on the wrong step also parses. That one
        # happened here, leaving actions/setup-go with no go-version and this
        # script with inputs it ignores. It went unnoticed because the test job
        # is skipped on every commit that touches only CI.
        run: ./scripts/check-workflows.py

      - name: Check every source file is tracked
        # A source file excluded by .gitignore builds fine locally and fails
        # only in CI, because a fresh checkout does not have it. This caught
        # internal/config/ being swallowed by an unanchored "config/" pattern.
        run: ./scripts/check-tracked.sh

      - name: Check the Docker build context
        # The Dockerfile once copied scripts/ while .dockerignore excluded it,
        # and the build died at 'failed to calculate checksum' — which reads
        # like a cache problem and is not one.
        run: |
          ./scripts/check-docker-context.sh Dockerfile.go-build .dockerignore .
          ./scripts/check-docker-context.sh OLD/Dockerfile.node OLD/.dockerignore OLD

      - name: Check the Docker base image accounts
        # Alpine reserves GID 100 for `users`, which is the PGID this image
        # defaults to. Creating a group there fails the image build with a
        # bare "exit code: 1". Only the base image knows this, so the check
        # downloads its minirootfs and reads the real /etc/passwd and
        # /etc/group rather than guessing.
        run: ./scripts/check-docker-base.sh Dockerfile.go-build


      - name: Verify CGO stays disabled
        # modernc.org/sqlite is pure Go precisely so the release binary is
        # static. A cgo dependency slipping in would silently break that.
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Test with the race detector
        run: go test -race -count=1 ./...

      - name: Audit filesystem access
        run: |
          hits=$(grep -rn --include='*.go' -E '\bos\.(Open|Create|OpenFile|WriteFile|ReadFile|RemoveAll|MkdirAll|Rename)\(' \
            ./cmd ./internal \
            | grep -v '_test\.go:' \
            | grep -v -E '^\./internal/(vfs|upload|store|config|crypt)/' \
            | grep -v -E 'internal/server/fsutil\.go' \
            | grep -v -E '^\./cmd/verify-cutover/' || true)
          if [ -n "$hits" ]; then
            echo "::error::user-data I/O must go through vfs.Resolve (internal/vfs)"
            echo "$hits"
            exit 1
          fi
          echo "no user-data filesystem access outside the allowed packages"

      - name: Audit for weak crypto
        run: |
          if grep -rn --include='*.go' -E '\bmd5\b|crypto/des\b' ./cmd ./internal; then
            echo "::error::weak or deprecated crypto primitive found"
            exit 1
          fi

  build:
    needs: [detect, test]
    # always() is required because a skipped dependency would otherwise skip
    # this job too. The condition then encodes the real rule: if the core
    # was untouched the tests never ran, so the build proceeds; if it
    # changed, the tests must have passed first.
    if: >-
      always() &&
      (needs.detect.outputs.core_changed == 'false' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history is no longer needed to decide `latest`, which now
          # comes from the registry, but it still makes a missing or wrong tag
          # list obvious in the logs rather than ambiguous.
          fetch-depth: 0

      # These run here as well as in the test job, because the test job is
      # skipped when the core is unchanged — and a Dockerfile change is exactly
      # the kind of commit that skips it. Without this, fixing the Dockerfile
      # would skip the very checks meant to validate the fix.
      - name: Check the Dockerfile before building
        run: |
          ./scripts/check-docker-context.sh Dockerfile.go-build .dockerignore .
          ./scripts/check-docker-base.sh Dockerfile.go-build

      - name: Check the workflow files
        # yaml.safe_load is not enough: a step can be spliced into the middle
        # of another step's `run:` block and the file still parses. Three such
        # edits got through here, and one shipped `fetch-depth: 0` into a
        # shell script where the runner tried to execute it.
        run: ./scripts/check-workflows.py


      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # The GHCR PAT is stored on the Gitea instance, not taken from the
          # mirrored repository's GitHub token — a mirror's GITHUB_TOKEN is
          # scoped to Gitea and cannot write to GHCR.
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Work out the tags
        id: meta
        run: |
          set -eu
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          SHA=$(git rev-parse --short HEAD)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          tags="$IMAGE:$VERSION,$IMAGE:$MINOR,$IMAGE:$MAJOR,$IMAGE:sha-$SHA"

          # `latest` moves only when this build is at least as new as
          # the highest version already published. Otherwise merging a
          # stale branch would drag every user pulling `latest` back to
          # an old image.
          #
          # The record of what has been published is the registry, not
          # the git tags. The mirror's checkout carries only the tags
          # GitHub happens to have, and nothing was ever creating them:
          # the sole tag was v2.0.0, so every release since was judged
          # "older than the newest tag" and `latest` stayed frozen on
          # 2.0.0 while 2.0.8 shipped. Anyone pulling `latest` was served
          # the oldest image in the repository.
          #
          # If the query fails the list comes back empty and `latest`
          # moves. That is the right way round: the alternative is the
          # frozen stale tag this replaces, and a missing safeguard is
          # better than an inverted one.
          published=$(curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.GHCR_TOKEN }}" \
            "https://${{ env.REGISTRY }}/v2/${{ env.IMAGE_NAME }}/tags/list?n=1000" \
            | tr ',' '\n' | tr -d '"[]{}' | sed 's/^.*://' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          newest=$(printf '%s\n' "$published" | sed '/^$/d' | sort -V | tail -1)

          if [ -z "$newest" ]; then
            tags="$tags,$IMAGE:latest"
            echo "no version tags published yet; latest will point here"
          elif [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
            tags="$tags,$IMAGE:latest"
            echo "$VERSION is at least the highest published ($newest); latest will point here"
          else
            echo "highest published is $newest, above $VERSION; latest left alone"
          fi

          # Emitted comma-separated on one line, never as the multi-line
          # "key<<EOF" heredoc. Gitea's runner does not implement the heredoc
          # form, so the tags arrive as one space-joined string and buildx
          # rejects the whole thing with:
          #   invalid tag "ghcr.io/...:2.0.3 ghcr.io/...:2.0 ..."
          #
          # build-push-action parses its list inputs on commas *and* newlines,
          # so a comma-separated single line is unambiguous on both runners.
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Tags for $IMAGE"
            echo '```'
            echo "$tags" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.go-build
          push: true
          # The deployment target is x64. Without this the image is built
          # for whichever architecture the runner happens to be, so an ARM
          # runner would publish an arm64 image under the same tags and
          # quietly replace the x64 one. Stated here so it cannot drift.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=My Cloud
            org.opencontainers.image.description=Self-hosted file sharing with plain files on disk
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ env.IMAGE_NAME }}
          provenance: true
          sbom: true
          # No buildx cache. `type=gha` talks to the Actions *artifact cache*
          # service over ACTIONS_RUNTIME_URL. That is a different endpoint from
          # the one actions/cache uses for the Go toolchain cache in the test
          # job, which works fine — so the runner is not simply offline. The
          # artifact cache service specifically is unreachable here, and the
          # build died on it:
          #
          #   DeadlineExceeded: Get ".../_apis/artifactcache/cache?...":
          #     dial tcp 172.26.0.3:43009: i/o timeout
          #
          # `ignore-error=true` would stop it being fatal, but the timeout is
          # still paid on every run, for a cache that has never once hit.
          # Restoring it on a runner with the service reachable is just adding
          # these two lines back.

      - name: Smoke test the pushed image
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
          RUN_OUT=
          APP=http://127.0.0.1:8686

          # Every failure funnels through here. The diagnosis is printed as the
          # tail of the step and repeated as ::error:: annotations, so it
          # appears in the failure summary rather than only in the scrollback.
          diagnose() {
            {
              echo "reason: $1"
              echo "docker run said: ${RUN_OUT:-(nothing — it was not reached)}"
              echo "image:  $(docker image inspect "$IMAGE" --format 'arch={{.Architecture}} entrypoint={{.Config.Entrypoint}} user={{.Config.User}}' 2>&1)"
              echo "state:  $(docker ps -a --filter name=mc --format '{{.Status}}' 2>&1)"
              echo "exit:   $(docker inspect -f '{{.State.ExitCode}}' mc 2>/dev/null || echo unknown)"
              echo ""
              echo "container logs:"
              docker logs mc 2>&1 | tail -30
              echo ""
              echo "reached the server from inside the container:"
              docker exec mc wget -qO- "$APP/api/version" 2>&1 | head -5
              echo ""
              echo "probe (bypasses the entrypoint, so it chowns first to match what"
              echo "the entrypoint does before dropping privileges):"
              docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
                echo "su-exec:   $(command -v su-exec || echo NOT-ON-PATH)"
                echo "binary:    $(ls -l /app/my-cloud 2>&1)"
                chown -R 99:100 /config /data 2>&1
                echo "config:    $(su-exec 99:100 touch /config/.probe 2>&1 && echo writable || echo NOT-WRITABLE)"
                echo "data:      $(su-exec 99:100 touch /data/.probe 2>&1 && echo writable || echo NOT-WRITABLE)"
              ' 2>&1
            } 2>&1
          }

          # Repeat the captured diagnosis as error annotations. A log group is
          # easy to scroll past, and the failure summary is not.
          announce() {
            echo ""
            echo "--- the lines above are the diagnosis, as error annotations ---"
            tail -25 /tmp/diag.txt | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::$line"; fi
            done || true
          }

          # Set once the diagnosis has been taken, so the trap does not run a
          # second probe container and duplicate the whole block.
          diagnosed=

          report() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ -z "$diagnosed" ]; then
              diagnose "the smoke test failed" > /tmp/diag.txt 2>&1 || true
              echo "::group::diagnostics"
              cat /tmp/diag.txt
              echo "::endgroup::"
              announce
            fi
            docker rm -f mc >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap report EXIT

          # No -p. Publishing a host port and then curling it from the job
          # assumes the runner shares a network namespace with the docker
          # daemon. act does not: it runs the job inside a container, so
          # 127.0.0.1 there is not the daemon's host, and the request never
          # arrives. Every check below runs through `docker exec` instead, which
          # has no such assumption and behaves identically on GitHub Actions,
          # Gitea and act.
          echo "running $IMAGE"
          if ! RUN_OUT=$(docker run -d --name mc "$IMAGE" 2>&1); then
            RUN_OUT=$(printf '%s' "$RUN_OUT" | tr '\n' ' ')
            diagnosed=1
            diagnose "docker run could not start the container" > /tmp/diag.txt 2>&1 || true
            tail -25 /tmp/diag.txt
            announce
            exit 1
          fi
          echo "container id $RUN_OUT"

          up=
          for i in $(seq 1 45); do
            if docker exec mc wget -qO- "$APP/healthz" >/dev/null 2>&1; then
              up=1
              break
            fi
            # Stop waiting the moment the container dies, rather than burning
            # the full timeout on a container that is already gone.
            if [ "$(docker inspect -f '{{.State.Running}}' mc 2>/dev/null)" = "false" ]; then
              break
            fi
            [ $((i % 10)) -eq 0 ] && echo "still waiting after ${i}s: $(docker inspect -f '{{.State.Status}}' mc 2>/dev/null || echo gone)"
            sleep 1
          done

          if [ -z "$up" ]; then
            diagnosed=1
            diagnose "the server never answered $APP/healthz from inside the container" > /tmp/diag.txt 2>&1 || true
            tail -25 /tmp/diag.txt
            announce
            exit 1
          fi
          echo "the server answered from inside the container"

          # The version inside the container must match the tag it was pulled
          # by, or the tag and the binary have drifted.
          inside=$(docker exec mc wget -qO- "$APP/api/version" | grep -o '"version": *"[^"]*"' | head -1)
          echo "container reports $inside, expected $VERSION"
          echo "$inside" | grep -q "$VERSION" || { echo "::error::version drift: container has $inside, tag says $VERSION"; exit 1; }

          docker exec mc wget -qO- "$APP/api/status" | grep -q '"needsSetup":true' \
            || { echo "::error::first boot should report needsSetup:true"; exit 1; }

          # The deployment target is x64. The binary reports how it was built,
          # so this catches an image published for the wrong architecture.
          platform=$(docker exec mc wget -qO- "$APP/api/version" | tr ',' '\n' | grep '"platform"')
          echo "container reports $platform, expected linux/amd64"
          echo "$platform" | grep -q 'linux/amd64' || { echo "::error::wrong architecture: $platform"; exit 1; }

          echo "smoke test passed"
          docker logs mc

  webdav-conformance:
    # The plan names hand-rolled WebDAV edge cases as a risk and says to test
    # against real clients. rclone is what users actually mount with.
    #
    # Gated on the same detect job as the unit suite: it drives a real server
    # built from this commit, so if nothing under cmd/, internal/, or web/
    # changed, the server it would exercise is identical to the last one that
    # passed. Installing rclone and round-tripping files buys nothing for a
    # docs or compose edit.
    needs: detect
    if: needs.detect.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install rclone
        run: |
          curl -sO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-v*-linux-amd64/rclone /usr/local/bin/
      - name: Start the server
        run: |
          mkdir -p cfg data
          ./scripts/build.sh
          ./my-cloud &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8686/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8686/healthz
      - name: Round-trip files over WebDAV
        env:
          MYCLOUD_CONFIG_DIR: cfg
          MYCLOUD_DATA_DIR: data
        run: ./scripts/dav-conformance.sh