<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cloud</title>
<meta name="theme-color" content="#12151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Cloud">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>try { var t = localStorage.getItem('mycloud_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234f8ff7' d='M6.5 20a5.5 5.5 0 0 1-.44-10.98A7 7 0 0 1 19.5 11a4.5 4.5 0 0 1-.5 8.97z'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <!-- Auth screens -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">☁️</div>
      <h1 id="auth-title">My Cloud</h1>
      <p id="auth-subtitle" class="muted"></p>
      <form id="auth-form">
        <input id="auth-username" type="text" placeholder="Username" autocomplete="username" required>
        <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required>
        <input id="auth-password2" type="password" placeholder="Confirm password" class="hidden" autocomplete="new-password">
        <input id="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code or recovery code" class="hidden">
        <div id="auth-error" class="form-error hidden"></div>
        <button type="submit" class="btn primary wide" id="auth-submit">Sign in</button>
      </form>
    </div>
  </div>

  <!-- Main app -->
  <div id="main-screen" class="main-screen hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">☁️</span><span id="brand-name">My Cloud</span></div>
      <nav>
        <button class="nav-item active" data-view="files"><span class="ni">📁</span>Files</button>
        <button class="nav-item" data-view="shares"><span class="ni">🔗</span>Shared links</button>
        <button class="nav-item" data-view="trash"><span class="ni">🗑️</span>Trash</button>
        <button class="nav-item hidden" data-view="admin" id="nav-admin"><span class="ni">👥</span>Admin</button>
      </nav>
      <div class="sidebar-footer">
        <div id="usage-widget" class="usage-widget hidden">
          <div class="usage-bar"><div id="usage-fill"></div></div>
          <div id="usage-text" class="usage-text"></div>
        </div>
        <div class="user-row">
          <span id="user-name" class="user-name"></span>
          <button id="btn-connect" class="icon-btn" title="Connect a drive (WebDAV)">🔌</button>
          <button id="btn-theme" class="icon-btn" title="Theme: auto">🌓</button>
          <button id="btn-account" class="icon-btn" title="Account">⚙️</button>
          <button id="btn-logout" class="icon-btn" title="Sign out">⏻</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <button id="btn-menu" class="icon-btn mobile-only" title="Menu">☰</button>
        <div class="search-wrap">
          <input id="search-input" type="search" placeholder="Search files…">
        </div>
        <div class="topbar-actions" id="files-actions">
          <button id="btn-view-toggle" class="icon-btn" title="Toggle view">▦</button>
          <button id="btn-new-folder" class="btn">New folder</button>
          <button id="btn-upload" class="btn primary">⬆ Upload</button>
          <input id="file-input" type="file" multiple class="hidden">
          <input id="folder-input" type="file" webkitdirectory class="hidden">
        </div>
      </header>

      <!-- Files view -->
      <section id="view-files" class="view">
        <div class="pathbar">
          <div id="breadcrumbs" class="breadcrumbs"></div>
          <div id="selection-bar" class="selection-bar hidden">
            <span id="selection-count"></span>
            <button class="btn sm" id="sel-download">Download</button>
            <button class="btn sm" id="sel-move">Move</button>
            <button class="btn sm" id="sel-copy">Copy</button>
            <button class="btn sm danger" id="sel-delete">Delete</button>
            <button class="btn sm ghost" id="sel-clear">✕</button>
          </div>
        </div>
        <div id="drop-zone" class="file-area">
          <div id="file-list" class="file-list"></div>
          <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">📂</div>
            <p>This folder is empty</p>
            <p class="muted">Drag files here or click Upload</p>
          </div>
          <div class="drop-overlay"><div>Drop files to upload</div></div>
        </div>
      </section>

      <!-- Search results -->
      <section id="view-search" class="view hidden">
        <div class="pathbar"><h2 id="search-title">Search</h2></div>
        <div id="search-results" class="file-list list-mode"></div>
      </section>

      <!-- Shares view -->
      <section id="view-shares" class="view hidden">
        <div class="pathbar"><h2>Shared links</h2></div>
        <div id="shares-list" class="cards"></div>
      </section>

      <!-- Trash view -->
      <section id="view-trash" class="view hidden">
        <div class="pathbar">
          <h2>Trash</h2>
          <button id="btn-empty-trash" class="btn danger sm">Empty trash</button>
        </div>
        <div id="trash-list" class="file-list list-mode"></div>
      </section>

      <!-- Admin view -->
      <section id="view-admin" class="view hidden">
        <div class="pathbar"><h2>Users</h2><button id="btn-add-user" class="btn primary sm">Add user</button></div>
        <div id="users-list" class="cards"></div>
        <div class="pathbar"><h2>Settings</h2></div>
        <div class="cards">
          <div class="card">
            <form id="settings-form" class="settings-form">
              <label>Site name <input id="set-sitename" type="text" maxlength="60"></label>
              <label>Default quota for new users (MB, 0 = unlimited) <input id="set-quota" type="number" min="0"></label>
              <label>Trash retention (days, 0 = keep forever) <input id="set-trash" type="number" min="0"></label>
              <label class="check" style="flex-direction:row;align-items:center"><input id="set-shares" type="checkbox" style="width:auto"> Allow users to create public share links</label>
              <button class="btn primary sm" type="submit">Save settings</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Upload progress -->
<div id="upload-panel" class="upload-panel hidden">
  <div class="upload-header"><span id="upload-title">Uploading…</span><button id="upload-close" class="icon-btn">✕</button></div>
  <div class="upload-bar"><div id="upload-fill"></div></div>
  <div id="upload-detail" class="upload-detail"></div>
</div>

<!-- Preview overlay -->
<div id="preview" class="preview hidden">
  <div class="preview-top">
    <span id="preview-name"></span>
    <div>
      <button id="preview-download" class="btn sm">Download</button>
      <button id="preview-close" class="icon-btn" title="Close">✕</button>
    </div>
  </div>
  <button id="preview-prev" class="preview-nav prev">‹</button>
  <div id="preview-body" class="preview-body"></div>
  <button id="preview-next" class="preview-nav next">›</button>
</div>

<!-- Generic modal -->
<div id="modal" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<div id="context-menu" class="context-menu hidden"></div>
<div id="toasts" class="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
