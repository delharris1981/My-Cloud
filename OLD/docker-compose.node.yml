# My Cloud — the archived Node build, pulled from GHCR.
#
# This is the rollback target. It is no longer developed: the Node
# implementation is frozen under OLD/ and the Go rewrite in the repository root
# replaces it. See docker-compose.go.yml for the current build.
#
#   docker compose -f OLD/docker-compose.node.yml up -d
#
# Switching between the two is a change of image tag. Both read the same
# /config and /data, so there is nothing to migrate in either direction: the Go
# server imports the Node data on first boot and renames the originals to
# .migrated.bak.
services:
  my-cloud:
    image: ghcr.io/delharris1981/my-cloud:${MYCLOUD_NODE_TAG:-node-latest}
    container_name: my-cloud-node
    ports:
      # Offset so both can run side by side during a strangler rollout.
      - "8687:8686"
    environment:
      - PUID=99
      - PGID=100
      - UMASK=022
    volumes:
      - ./config:/config
      - ./data:/data
    restart: unless-stopped