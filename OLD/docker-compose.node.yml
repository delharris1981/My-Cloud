# Node build of My Cloud — the current production image. Kept as the rollback
# target during the strangler rollout; see docker-compose.go.yml for the Go
# build.
#
#   docker compose up -d
#
services:
  my-cloud:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: my-cloud-node
    ports:
      - "8686:8686"
    environment:
      # File ownership for created files (defaults are Unraid's nobody:users).
      - PUID=99
      - PGID=100
      - UMASK=022
    volumes:
      # App settings, users, shares (tiny JSON files)
      - ./config:/config
      # Your files live here: /data/users/<username>/files
      - ./data:/data
    restart: unless-stopped
